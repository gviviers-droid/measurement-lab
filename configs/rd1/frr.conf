frr defaults traditional
hostname dest-1
service integrated-vtysh-config
!
interface lo
 ip address 10.40.255.1/32
 ipv6 address 3fff:40::1/128
!
interface eth1
 description to transit (AS 65030)
 ip address 100.64.34.2/30
 ipv6 address 3fff:30:0:34::2/64
!
interface eth2
 description destination LAN (target1)
 ip address 10.40.10.1/24
 ipv6 address 3fff:40:10::1/64
!
interface eth3
 description IXP port (peering dormant in base state)
 ip address 100.64.99.40/24
 ipv6 address 3fff:ff::40/64
!
ip route 10.40.0.0/16 Null0
ipv6 route 3fff:40::/32 Null0
!
router bgp 65040
 bgp router-id 10.40.255.1
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 no bgp default ipv4-unicast
 neighbor 100.64.34.1 remote-as 65030
 neighbor 3fff:30:0:34::1 remote-as 65030
 neighbor 100.64.99.1 remote-as 65100
 neighbor 100.64.99.1 shutdown
 neighbor 3fff:ff::1 remote-as 65100
 neighbor 3fff:ff::1 shutdown
 !
 address-family ipv4 unicast
  network 10.40.0.0/16
  neighbor 100.64.34.1 activate
  neighbor 100.64.99.1 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 3fff:40::/32
  neighbor 3fff:30:0:34::1 activate
  neighbor 3fff:ff::1 activate
 exit-address-family
!
