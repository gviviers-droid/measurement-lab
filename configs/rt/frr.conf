frr defaults traditional
hostname transit
service integrated-vtysh-config
!
interface lo
 ip address 10.30.255.1/32
 ipv6 address 3fff:30::1/128
!
interface eth1
 description to upstream-a (AS 65010)
 ip address 100.64.13.2/30
 ipv6 address 3fff:30:0:13::2/64
!
interface eth2
 description to upstream-b (AS 65020)
 ip address 100.64.23.2/30
 ipv6 address 3fff:30:0:23::2/64
!
interface eth3
 description to dest-1 (AS 65040)
 ip address 100.64.34.1/30
 ipv6 address 3fff:30:0:34::1/64
!
interface eth4
 description to dest-2 (AS 65050, backup path)
 ip address 100.64.35.1/30
 ipv6 address 3fff:30:0:35::1/64
!
ip route 10.30.0.0/16 Null0
ipv6 route 3fff:30::/32 Null0
!
route-map PREFER-UPSTREAM-A permit 10
 set local-preference 200
!
router bgp 65030
 bgp router-id 10.30.255.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 100.64.13.1 remote-as 65010
 neighbor 3fff:30:0:13::1 remote-as 65010
 neighbor 100.64.23.1 remote-as 65020
 neighbor 3fff:30:0:23::1 remote-as 65020
 neighbor 100.64.34.2 remote-as 65040
 neighbor 3fff:30:0:34::2 remote-as 65040
 neighbor 100.64.35.2 remote-as 65050
 neighbor 3fff:30:0:35::2 remote-as 65050
 !
 address-family ipv4 unicast
  network 10.30.0.0/16
  neighbor 100.64.13.1 activate
  neighbor 100.64.13.1 route-map PREFER-UPSTREAM-A in
  neighbor 100.64.23.1 activate
  neighbor 100.64.34.2 activate
  neighbor 100.64.35.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 3fff:30::/32
  neighbor 3fff:30:0:13::1 activate
  neighbor 3fff:30:0:13::1 route-map PREFER-UPSTREAM-A in
  neighbor 3fff:30:0:23::1 activate
  neighbor 3fff:30:0:34::2 activate
  neighbor 3fff:30:0:35::2 activate
 exit-address-family
!
