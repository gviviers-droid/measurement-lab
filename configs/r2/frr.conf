frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface lo
 ip address 10.1.255.2/32
 ipv6 address 3fff:1::2/128
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface eth1
 description to r3
 ip address 10.1.2.1/30
 ipv6 address 3fff:1:0:2::1/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth2
 description to r1
 ip address 10.1.3.2/30
 ipv6 address 3fff:1:0:3::2/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth3
 description to upstream-b (AS 65020)
 ip address 100.64.22.2/30
 ipv6 address 3fff:20:0:22::2/64
!
interface eth4
 description IXP port (peering dormant until Activity: Enable Peering)
 ip address 100.64.99.100/24
 ipv6 address 3fff:ff::100/64
!
ip route 10.1.0.0/16 Null0
ipv6 route 3fff:1::/32 Null0
!
router ospf
 ospf router-id 10.1.255.2
!
router ospf6
 ospf6 router-id 10.1.255.2
!
router bgp 65001
 bgp router-id 10.1.255.2
 no bgp ebgp-requires-policy
 no bgp enforce-first-as
 no bgp default ipv4-unicast
 neighbor 10.1.255.1 remote-as 65001
 neighbor 10.1.255.1 update-source lo
 neighbor 10.1.255.3 remote-as 65001
 neighbor 10.1.255.3 update-source lo
 neighbor 3fff:1::1 remote-as 65001
 neighbor 3fff:1::1 update-source lo
 neighbor 3fff:1::3 remote-as 65001
 neighbor 3fff:1::3 update-source lo
 neighbor 100.64.22.1 remote-as 65020
 neighbor 100.64.22.1 description upstream-b
 neighbor 3fff:20:0:22::1 remote-as 65020
 neighbor 3fff:20:0:22::1 description upstream-b
 neighbor 100.64.99.1 remote-as 65100
 neighbor 100.64.99.1 description IXP route server (dormant)
 neighbor 100.64.99.1 shutdown
 neighbor 3fff:ff::1 remote-as 65100
 neighbor 3fff:ff::1 description IXP route server (dormant)
 neighbor 3fff:ff::1 shutdown
 !
 address-family ipv4 unicast
  network 10.1.0.0/16
  neighbor 10.1.255.1 activate
  neighbor 10.1.255.1 next-hop-self
  neighbor 10.1.255.3 activate
  neighbor 10.1.255.3 next-hop-self
  neighbor 100.64.22.1 activate
  neighbor 100.64.99.1 activate
  neighbor 100.64.99.1 route-map FROM-IXP in
 exit-address-family
 !
 address-family ipv6 unicast
  network 3fff:1::/32
  neighbor 3fff:1::1 activate
  neighbor 3fff:1::1 next-hop-self
  neighbor 3fff:1::3 activate
  neighbor 3fff:1::3 next-hop-self
  neighbor 3fff:20:0:22::1 activate
  neighbor 3fff:ff::1 activate
  neighbor 3fff:ff::1 route-map FROM-IXP in
 exit-address-family
!
route-map FROM-IXP permit 10
 set local-preference 250
!
