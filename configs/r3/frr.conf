frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface lo
 ip address 10.1.255.3/32
 ipv6 address 3fff:1::3/128
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface eth1
 description to r1
 ip address 10.1.1.2/30
 ipv6 address 3fff:1:0:1::2/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth2
 description to r2
 ip address 10.1.2.2/30
 ipv6 address 3fff:1:0:2::2/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth3
 description learner LAN
 ip address 10.1.10.1/24
 ipv6 address 3fff:1:10::1/64
 ip ospf area 0
 ip ospf passive
 ipv6 ospf6 area 0
 ipv6 ospf6 passive
!
router ospf
 ospf router-id 10.1.255.3
!
router ospf6
 ospf6 router-id 10.1.255.3
!
router bgp 65001
 bgp router-id 10.1.255.3
 no bgp default ipv4-unicast
 neighbor 10.1.255.1 remote-as 65001
 neighbor 10.1.255.1 update-source lo
 neighbor 10.1.255.2 remote-as 65001
 neighbor 10.1.255.2 update-source lo
 neighbor 3fff:1::1 remote-as 65001
 neighbor 3fff:1::1 update-source lo
 neighbor 3fff:1::2 remote-as 65001
 neighbor 3fff:1::2 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.1.255.1 activate
  neighbor 10.1.255.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 3fff:1::1 activate
  neighbor 3fff:1::2 activate
 exit-address-family
!
