frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface lo
 ip address 10.1.255.1/32
 ipv6 address 3fff:1::1/128
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface eth1
 description to r3
 ip address 10.1.1.1/30
 ipv6 address 3fff:1:0:1::1/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth2
 description to r2
 ip address 10.1.3.1/30
 ipv6 address 3fff:1:0:3::1/64
 ip ospf area 0
 ip ospf network point-to-point
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
!
interface eth3
 description to upstream-a (AS 65010)
 ip address 100.64.11.2/30
 ipv6 address 3fff:10:0:11::2/64
!
ip route 10.1.0.0/16 Null0
ipv6 route 3fff:1::/32 Null0
!
router ospf
 ospf router-id 10.1.255.1
!
router ospf6
 ospf6 router-id 10.1.255.1
!
router bgp 65001
 bgp router-id 10.1.255.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.1.255.2 remote-as 65001
 neighbor 10.1.255.2 update-source lo
 neighbor 10.1.255.3 remote-as 65001
 neighbor 10.1.255.3 update-source lo
 neighbor 3fff:1::2 remote-as 65001
 neighbor 3fff:1::2 update-source lo
 neighbor 3fff:1::3 remote-as 65001
 neighbor 3fff:1::3 update-source lo
 neighbor 100.64.11.1 remote-as 65010
 neighbor 100.64.11.1 description upstream-a
 neighbor 3fff:10:0:11::1 remote-as 65010
 neighbor 3fff:10:0:11::1 description upstream-a
 !
 address-family ipv4 unicast
  network 10.1.0.0/16
  neighbor 10.1.255.2 activate
  neighbor 10.1.255.2 next-hop-self
  neighbor 10.1.255.3 activate
  neighbor 10.1.255.3 next-hop-self
  neighbor 100.64.11.1 activate
  neighbor 100.64.11.1 route-map FROM-UPSTREAM-A in
 exit-address-family
 !
 address-family ipv6 unicast
  network 3fff:1::/32
  neighbor 3fff:1::2 activate
  neighbor 3fff:1::2 next-hop-self
  neighbor 3fff:1::3 activate
  neighbor 3fff:1::3 next-hop-self
  neighbor 3fff:10:0:11::1 activate
  neighbor 3fff:10:0:11::1 route-map FROM-UPSTREAM-A in
 exit-address-family
!
route-map FROM-UPSTREAM-A permit 10
 set local-preference 200
!
